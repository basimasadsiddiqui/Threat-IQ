name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Lint
        run: ruff check threatiq ui tests

      - name: Test
        # No API keys are set, so the suite must pass with every external
        # source unavailable, that is the degraded path we ship.
        run: pytest -q --tb=short

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Static security analysis (bandit)
        # B101 (assert) is excluded: asserts are used for type narrowing on
        # the httpx client handle, never for runtime validation.
        run: bandit -r threatiq -ll --skip B101

      - name: Dependency vulnerability audit (pip-audit)
        run: pip-audit -r requirements.txt --strict
        continue-on-error: true   # advisory: a new CVE should not block a PR

  docker:
    runs-on: ubuntu-latest
    needs: [test]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3

      - name: Build API image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: api
          push: false
          load: true
          tags: threatiq-api:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build UI image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: ui
          push: false
          load: true
          tags: threatiq-ui:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test the API image
        run: |
          docker run -d --name threatiq-api -p 8000:8000 threatiq-api:ci
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:8000/health >/dev/null 2>&1; then
              echo "API is healthy"
              curl -s http://localhost:8000/health | head -c 800
              docker rm -f threatiq-api
              exit 0
            fi
            sleep 2
          done
          echo "API failed to become healthy"
          docker logs threatiq-api
          docker rm -f threatiq-api
          exit 1
