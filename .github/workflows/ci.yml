name: CI

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Lint
        run: ruff check threatiq ui tests

      - name: Test
        # No API keys are set, so the suite must pass with every external
        # source unavailable, that is the degraded path we ship.
        run: pytest -q --tb=short

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Static security analysis (bandit)
        # B101 (assert) is excluded: asserts are used for type narrowing on
        # the httpx client handle, never for runtime validation.
        run: bandit -r threatiq -ll --skip B101

      - name: Dependency vulnerability audit (pip-audit)
        run: pip-audit -r requirements.txt --strict
        continue-on-error: true   # advisory: a new CVE should not block a PR

  docker:
    runs-on: ubuntu-latest
    needs: [test]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3

      - name: Build API image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: api
          push: false
          load: true
          tags: threatiq-api:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build UI image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: ui
          push: false
          load: true
          tags: threatiq-ui:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test the API image
        run: |
          docker run -d --name threatiq-api -p 8000:8000 threatiq-api:ci
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:8000/health >/dev/null 2>&1; then
              echo "API is healthy"
              curl -s http://localhost:8000/health | head -c 800
              docker rm -f threatiq-api
              exit 0
            fi
            sleep 2
          done
          echo "API failed to become healthy"
          docker logs threatiq-api
          docker rm -f threatiq-api
          exit 1

  publish:
    # The `docker` job proves the images build and the API comes up healthy.
    # This one is the only place that pushes, and only from a real push on the
    # canonical repository: a fork or a pull request has no credentials and
    # must not go red because of it.
    if: github.event_name == 'push' && github.repository == 'basimasadsiddiqui/Threat-IQ'
    needs: [test, docker]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Check for Docker Hub credentials
        id: creds
        # `secrets` is not available in a job-level `if`, so the gate lives in
        # a step. A repository without the secrets set skips publishing with a
        # notice instead of failing the run.
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          if [ -n "$DOCKERHUB_USERNAME" ] && [ -n "$DOCKERHUB_TOKEN" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=Publish skipped::Set the DOCKERHUB_USERNAME and DOCKERHUB_TOKEN repository secrets to publish images."
          fi

      - uses: docker/setup-buildx-action@v3
        if: steps.creds.outputs.present == 'true'

      - name: Log in to Docker Hub
        if: steps.creds.outputs.present == 'true'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Tags and labels for the API image
        id: api_meta
        if: steps.creds.outputs.present == 'true'
        uses: docker/metadata-action@v5
        with:
          images: ${{ secrets.DOCKERHUB_USERNAME }}/threatiq-api
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=tag
            type=sha,format=short

      - name: Tags and labels for the UI image
        id: ui_meta
        if: steps.creds.outputs.present == 'true'
        uses: docker/metadata-action@v5
        with:
          images: ${{ secrets.DOCKERHUB_USERNAME }}/threatiq-ui
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=tag
            type=sha,format=short

      # linux/amd64 only. Apple Silicon runs these under Rosetta without
      # trouble, and cross-building Python images under QEMU roughly triples
      # the job. Add `platforms: linux/amd64,linux/arm64` to both steps below
      # if a native arm64 image is ever worth the build minutes.
      - name: Push the API image
        if: steps.creds.outputs.present == 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          target: api
          push: true
          tags: ${{ steps.api_meta.outputs.tags }}
          labels: ${{ steps.api_meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Push the UI image
        if: steps.creds.outputs.present == 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          target: ui
          push: true
          tags: ${{ steps.ui_meta.outputs.tags }}
          labels: ${{ steps.ui_meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Summary
        if: steps.creds.outputs.present == 'true'
        run: |
          {
            echo "### Published to Docker Hub"
            echo
            echo '```'
            echo "${{ steps.api_meta.outputs.tags }}"
            echo "${{ steps.ui_meta.outputs.tags }}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
